name: Deploy MifTech portfolio concurrency: 
on:
push:
  branches: ["main"]
  workflow_dispatch:
  permission:
   contents: read
   pages: write
   id-token: write

   concurrency:
    group: "pagrs"
    cancel-in-progress: true

    jobs:
      deploy:
      environment:
      name: github-pages
      url: $
      {{ steps.deployment.outputs.page_url }}
          
      runs-on: ubuntu-last

      steps:
        name: checkout
        uses: actions/checkout@v4

        name: setup pages
        uses: action/configure-pages@v5

        name: upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
         path: "./frontend"

         name: Deploy to GitHub pages 
         id: deployment
         uses: actions/deploy-pages@v4
